# Advisories against the site's lockfile that cannot reach the built site.
# osv-scanner and the OpenSSF Scorecard read this file, which sits next to
# package-lock.json. Each entry gives its reason and lapses on its
# ignoreUntil date, so the record is looked at again; an entry goes once
# the lockfile no longer holds the affected version.
#
# vite 5.4.21 and esbuild 0.21.5: every advisory concerns a development
# server (vitepress dev, or esbuild's own serve mode). CI and the
# published site use vitepress build, whose static output runs no server.
# The vite fixes exist only from vite 6.4, which VitePress 1.6.4, the
# current stable release, does not accept. Until then the vite ones do
# apply to a contributor's own dev server (npm run docs:dev), which
# listens on localhost only.

