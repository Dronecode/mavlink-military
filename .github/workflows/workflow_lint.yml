name: Lint CI Workflows

# Lints the workflows and actions under .github: actionlint for mistakes
# (expression types, runner labels, shellcheck on run blocks), shellcheck
# for the helper scripts in .github/scripts, and zizmor for security
# problems (persisted credentials, template injection, unpinned actions).
# zizmor reads its waivers from .github/zizmor.yml. Dependabot does not
# see the release pins below; bump them by hand with their checksums.

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck (pinned release, checksum verified)
        # The runner image ships a shellcheck too, but its version moves with
        # the image; this one is the same on every run.
        id: shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          .github/scripts/workflow_lint/fetch_release.sh "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "$SHELLCHECK_SHA256" "$RUNNER_TEMP"
          "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
          echo "path=${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" >> "$GITHUB_OUTPUT"

      - name: Run actionlint (pinned release, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK: ${{ steps.shellcheck.outputs.path }}
        run: |
          .github/scripts/workflow_lint/fetch_release.sh "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" "${RUNNER_TEMP}/actionlint"
          "${RUNNER_TEMP}/actionlint/actionlint" -color -shellcheck="$SHELLCHECK"

      - name: Check the helper scripts with shellcheck
        env:
          SHELLCHECK: ${{ steps.shellcheck.outputs.path }}
        run: |
          "$SHELLCHECK" .github/scripts/*/*.sh
          echo "shellcheck: no findings in" .github/scripts/*/*.sh

      - name: Run the unit tests of this workflow's scripts
        run: python3 -m unittest discover --start-directory .github/scripts/workflow_lint/tests --verbose

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Run zizmor (pinned from PyPI)
        # The token is only used to read public metadata for the online
        # audits (impostor commits, known-vulnerable action versions).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet zizmor==1.30.1
          zizmor --no-progress .
