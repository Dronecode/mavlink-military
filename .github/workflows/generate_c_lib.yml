name: Generate MAVLink C Headers

on:
  push:
    branches: [main]
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/mavlink-pins.env"
      - ".github/actions/setup-mavlink-tooling/**"
      - ".github/scripts/generate_c_lib/**"
  pull_request:
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/mavlink-pins.env"
      - ".github/actions/setup-mavlink-tooling/**"
      - ".github/scripts/generate_c_lib/**"
  workflow_dispatch:

env:
  C_LIBRARY_REPO: Dronecode/mavlink-military-c_library_v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate:
    name: Generate C headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Generate C headers
        run: .github/scripts/generate_c_lib/generate_c_headers.sh . mavlink pymavlink out

      - name: Upload the generated headers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-headers
          path: out
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the unit tests of this workflow's scripts
        run: python3 -m unittest discover --start-directory .github/scripts/generate_c_lib/tests --verbose

  rehearse-publish:
    name: Rehearse the publish
    # publish runs only on main. On a pull request this job runs the same
    # script on the same headers, into an anonymous clone of the C library
    # that pushes to a local bare repository, so a change to the script or
    # to what it publishes shows in review. It holds no credentials.
    if: github.event_name == 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the generated headers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: c-headers
          path: out

      - name: Rehearse the publish into a local copy of the C library
        run: >-
          .github/scripts/generate_c_lib/rehearse_publish.sh . out
          "${GITHUB_SERVER_URL}/${C_LIBRARY_REPO}.git" "$RUNNER_TEMP"
          >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to the C library
    # Only main publishes, from the c-library environment, so the deploy key
    # can be kept in that environment and limited to main. It pushes the
    # headers the generate job built, so no generator code or Python package
    # runs in the job that holds the key, and it waits for the tests of the
    # scripts it runs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [generate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: c-library
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the generated headers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: c-headers
          path: out

      - name: Check out the C library repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.C_LIBRARY_REPO }}
          ssh-key: ${{ secrets.C_LIBRARY_DEPLOY_KEY }}
          path: c_library
          # publish_c_library.sh pushes through this checkout with the
          # deploy key, so it keeps its credentials.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Commit and push to the C library repository
        run: .github/scripts/generate_c_lib/publish_c_library.sh . out c_library
