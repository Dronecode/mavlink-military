name: Generate MAVLink C Headers

on:
  push:
    branches: [main]
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/mavlink-pins.env"
      - ".github/actions/setup-mavlink-tooling/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/mavlink-pins.env"
      - ".github/actions/setup-mavlink-tooling/**"
      - ".github/scripts/**"
  workflow_dispatch:

env:
  C_LIBRARY_REPO: Dronecode/mavlink-military-c_library_v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Generate C headers
        run: .github/scripts/generate_c_lib/generate_c_headers.sh . mavlink pymavlink out

      - name: Checkout C library repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.C_LIBRARY_REPO }}
          ssh-key: ${{ secrets.C_LIBRARY_DEPLOY_KEY }}
          path: c_library

      - name: Commit and push to C library repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: .github/scripts/generate_c_lib/publish_c_library.sh . out c_library

  test:
    name: Test the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the unit tests of this workflow's scripts
        run: python3 -m unittest discover --start-directory .github/scripts/generate_c_lib/tests --verbose
