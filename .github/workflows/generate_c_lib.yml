name: Generate MAVLink C Headers

on:
  push:
    branches: [main]
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/scripts/**"
  workflow_dispatch:

env:
  # Pinned generator inputs. Bump these deliberately, in their own PR, so a
  # change in the generated headers always traces back to a commit here.
  MAVLINK_REF: 87da370c02e40f6f9a2eacf1b162d7f07e640467
  PYMAVLINK_REF: 19880422d451de4daba3fd96781076afb1cb889c
  C_LIBRARY_REPO: Dronecode/mavlink-military-c_library_v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Checkout mavlink repository (dialect definitions)
        uses: actions/checkout@v4
        with:
          repository: mavlink/mavlink
          ref: ${{ env.MAVLINK_REF }}
          path: mavlink

      - name: Checkout pymavlink repository (code generator)
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/pymavlink
          ref: ${{ env.PYMAVLINK_REF }}
          path: pymavlink

      - name: Install pymavlink dependencies
        run: |
          pip install future lxml

      - name: Generate C headers
        run: source/.github/scripts/generate_c_headers.sh source mavlink pymavlink out

      - name: Checkout C library repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.C_LIBRARY_REPO }}
          ssh-key: ${{ secrets.C_LIBRARY_DEPLOY_KEY }}
          path: c_library

      - name: Commit and push to C library repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: source/.github/scripts/publish_c_library.sh source out c_library
