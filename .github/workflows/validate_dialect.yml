name: Validate Dialect

# Checks that the dialect definitions are valid, follow the documented ID
# allocation and still generate. Nothing here writes to the repository or
# publishes anything; generated code stays on the runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Install xmllint
        run: |
          command -v xmllint >/dev/null || sudo sh -c 'apt-get update -qq && apt-get install -y -qq libxml2-utils'
          xmllint --version 2>&1 | head -n 1

      - name: Validate the dialect files against the MAVLink schema
        # military_extensions.xml is a template and is never generated, so
        # this is the only check that keeps it valid.
        run: |
          xmllint --noout --schema pymavlink/generator/mavschema.xsd \
            military.xml military_extensions.xml

  policy:
    name: ID allocation and naming policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the 53xxx allocation, IDMAPPING.md and MAVLink naming conventions
        run: python3 .github/scripts/validate_dialect/check_dialect_policy.py

  script-tests:
    name: Check script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        # check_wire_compat.py, and so its tests, import pymavlink's parser.
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Run the unit tests of the check scripts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m unittest discover --start-directory .github/scripts/validate_dialect/tests --verbose

  wire-compat:
    name: Wire-compatibility report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Both checks only report: the dialect is still changing, and whether
      # a message may break is for the reviewers to decide. Set this to "1"
      # to make them fail once message IDs are frozen.
      WIRE_COMPAT_ENFORCE: "0"
    steps:
      - name: Check out this repository (full history for the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Compare wire identity against the PR base
        env:
          PYTHONPATH: ${{ github.workspace }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:military.xml" > "${RUNNER_TEMP}/base_military.xml"
          python3 .github/scripts/validate_dialect/check_wire_compat.py \
            "${RUNNER_TEMP}/base_military.xml" military.xml

      - name: Check for API breaks with mavlink's checker
        # check_api_break.py at the pinned MAVLINK_REF, the check mavlink runs
        # on its own definitions. It covers what CRC_EXTRA leaves out: changed
        # enum values, removed enum entries, and extension fields that are
        # removed, retyped or moved. It takes the base from the pull request
        # event and reads every XML file the pull request changes.
        run: .github/scripts/validate_dialect/run_api_break_check.sh mavlink/scripts/check_api_break.py "$WIRE_COMPAT_ENFORCE"

  generate-c:
    name: Generate and compile C
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Generate C bindings (validated, strict units)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pymavlink.tools.mavgen \
            --lang=C --wire-protocol=2.0 --strict-units \
            --output=build/c \
            mavlink/message_definitions/v1.0/military.xml

      - name: Type-check the generated headers at -Wall -Wextra -Werror
        # The repository has no code that uses the headers, so this checks
        # only that they compile: it includes the dialect header, which
        # type-checks every inline helper. -Wno-address-of-packed-member
        # silences a warning that mavgen's own helpers raise in the
        # common.xml headers, whatever the dialect contains.
        run: |
          echo '#include <military/mavlink.h>' | \
            gcc -std=c11 -Wall -Wextra -Werror -Wno-address-of-packed-member \
              -fsyntax-only -I build/c -x c -

  generate-python:
    name: Generate and import Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Generate Python bindings (validated, strict units)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pymavlink.tools.mavgen \
            --lang=Python --wire-protocol=2.0 --strict-units \
            --output="${RUNNER_TEMP}/military.py" \
            mavlink/message_definitions/v1.0/military.xml

      - name: Import the generated module
        # Checks that the module loads and that every message military.xml
        # defines is in its message map.
        run: python3 .github/scripts/validate_dialect/check_python_bindings.py "${RUNNER_TEMP}/military.py" military.xml

  example-digests:
    name: Metadata example digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every digest the metadata examples declare
        # Upstream MAVLink files are fetched at the commit their manifest URI
        # pins; everything else is read from this checkout.
        run: python3 .github/scripts/validate_dialect/check_example_digests.py
