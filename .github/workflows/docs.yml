name: Docs

# The message reference is generated at the MAVLINK_REF that
# .github/mavlink-pins.env pins, so a pin bump rebuilds the site too.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
      - ".github/scripts/docs/**"
  pull_request:
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
      - ".github/scripts/docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Project Pages URL until the custom domain is live. When it is: add
  # docs/public/CNAME, set the domain in Settings > Pages, remove DOCS_BASE,
  # and point DOCS_HOSTNAME at the new domain.
  DOCS_BASE: /mavlink-military/
  DOCS_HOSTNAME: https://dronecode.github.io/mavlink-military

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated timestamps come from git history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 lxml
          npm ci

      - name: Test the site checks
        run: |
          python3 -m unittest discover --start-directory scripts/tests --verbose
          python3 -m unittest discover --start-directory ../.github/scripts/docs/tests --verbose

      # Generated at the MAVLINK_REF pinned in .github/mavlink-pins.env.
      - name: Generate message reference
        run: npm run docs:messages

      - name: Build
        run: npm run docs:build

      # Every sitemap URL under the site address, and no dead link or anchor
      # on a hand-written page; dead anchors in the generated reference warn.
      - name: Check the built site
        run: npm run docs:check

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checks out the site check script
      pages: write # deploy-pages publishes the built site to GitHub Pages
      id-token: write # and proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out the site check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/docs

      - name: Check the deployed site
        # The site is live once deploy-pages returns, but the CDN can lag,
        # so each request retries.
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: .github/scripts/docs/check_deployed_site.sh "$SITE"
