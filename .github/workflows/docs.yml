name: Docs

# The message reference is generated at the MAVLINK_REF that
# .github/mavlink-pins.env pins, so a pin bump rebuilds the site too.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
  pull_request:
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Project Pages URL until the custom domain is live. When it is: add
  # docs/public/CNAME, set the domain in Settings > Pages, remove DOCS_BASE,
  # and point DOCS_HOSTNAME at the new domain.
  DOCS_BASE: /mavlink-military/
  DOCS_HOSTNAME: https://dronecode.github.io/mavlink-military

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated timestamps come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 lxml
          npm ci

      # Generated at the MAVLINK_REF pinned in .github/mavlink-pins.env.
      - name: Generate message reference
        run: npm run docs:messages

      - name: Build
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
