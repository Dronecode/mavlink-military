name: Docs

# The message reference is generated at the MAVLINK_REF that
# .github/mavlink-pins.env pins, so a pin bump rebuilds the site too.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
  pull_request:
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Project Pages URL until the custom domain is live. When it is: add
  # docs/public/CNAME, set the domain in Settings > Pages, remove DOCS_BASE,
  # and point DOCS_HOSTNAME at the new domain.
  DOCS_BASE: /mavlink-military/
  DOCS_HOSTNAME: https://dronecode.github.io/mavlink-military

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # lastUpdated timestamps come from git history
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 lxml
          npm ci

      # Generated at the MAVLINK_REF pinned in .github/mavlink-pins.env.
      - name: Generate message reference
        run: npm run docs:messages

      - name: Build
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy-pages publishes the built site to GitHub Pages
      id-token: write # and proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
