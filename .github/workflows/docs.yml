name: Docs

# Builds and checks the site's pages for one version and uploads them as an
# artifact; nothing here deploys. The message reference is generated at the
# MAVLINK_REF that .github/mavlink-pins.env pins, so a pin bump rebuilds the
# site too. On a pull request or by hand it builds main's pages, as a check.
# docs_deploy.yml calls it to build main's pages at main/ and deploys them;
# release.yml calls it with a release's tag to build that release's pages
# at <tag>/.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version whose pages to build, main or a release tag such as v1.0.0
        type: string
        default: main
      artifact:
        description: Name of the artifact the built site is uploaded as
        type: string
        default: docs-site

concurrency:
  # A called workflow takes its caller's name in github.workflow, so this
  # file's name keeps its group apart from the caller's and from the other
  # workflows the caller runs beside it.
  group: ${{ github.workflow }}-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Served at the root of the custom domain set in Settings > Pages; an
  # Actions deploy ignores a CNAME file. A fork served from
  # https://<owner>.github.io/<repo>/ sets DOCS_BASE to /<repo>/ and
  # DOCS_HOSTNAME to that address.
  DOCS_BASE: /
  DOCS_HOSTNAME: https://mavlink-m.dronecode.org
  # The version to build, below the root at <version>/: main unless a caller
  # names a release tag (config.mjs and check_site.py reject anything else).
  DOCS_VERSION: ${{ inputs.version || 'main' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated timestamps come from git history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Pages built for a caller restore no cache: they are deployed or
          # released, a cache is written by other runs and its contents are
          # not verified. Pull request checks may use one.
          cache: ${{ !inputs.version && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.version }}
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        # The Python packages install from a hash lock, as wheels only. npm ci
        # installs exactly what the lockfile pins, without running any
        # package's install script (esbuild's binary arrives as its own
        # platform package). npm audit signatures then checks every package
        # against the registry's signing keys.
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --no-deps -r ../.github/requirements/docs.txt
          npm ci --ignore-scripts
          npm audit signatures

      - name: Test the site checks
        run: |
          python3 -m unittest discover --start-directory scripts/tests --verbose
          python3 -m unittest discover --start-directory ../.github/scripts/docs/tests --verbose

      # Generated at the MAVLINK_REF pinned in .github/mavlink-pins.env.
      - name: Generate message reference
        run: npm run docs:messages

      - name: Build
        run: npm run docs:build

      # Every sitemap URL under the site address, and no dead link or anchor
      # on a hand-written page; dead anchors in the generated reference warn.
      - name: Check the built site
        run: npm run docs:check

      - name: Test the version layout and the version menu and banner rules
        run: npm run docs:test

      - name: Check the coverage of the site's version scripts
        # 100% of lines and branches; the tool is hash-locked and wheel-only.
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r ../.github/requirements/test.txt
          python3 -m coverage run --branch --data-file="$RUNNER_TEMP/.coverage" --source=scripts --omit='*/tests/*' \
            -m unittest scripts/tests/test_check_site.py scripts/tests/test_write_site_files.py
          python3 -m coverage report --data-file="$RUNNER_TEMP/.coverage" --show-missing --fail-under=100 \
            --include=scripts/check_site.py,scripts/write_site_files.py

      - name: Upload the built pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact || 'docs-site' }}
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 1
