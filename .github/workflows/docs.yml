name: Docs

# The message reference is generated at the MAVLINK_REF that
# .github/mavlink-pins.env pins, so a pin bump rebuilds the site too.
# release.yml calls this workflow with a release's tag to build that
# release's pages below the site's root, at <tag>/.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "military.xml"
      - "IDMAPPING.md"
      - ".github/workflows/docs.yml"
      - ".github/mavlink-pins.env"
      - ".github/scripts/docs/**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag whose pages to build, such as v1.0.0; empty for the site's root
        type: string
        default: ""
      artifact:
        description: Name of the artifact the built site is uploaded as
        type: string
        default: docs-site

concurrency:
  # A called workflow takes its caller's name in github.workflow, so this
  # file's name keeps its group apart from the caller's and from the other
  # workflows the caller runs beside it.
  group: ${{ github.workflow }}-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Served at the root of the custom domain set in Settings > Pages; an
  # Actions deploy ignores a CNAME file. A fork served from
  # https://<owner>.github.io/<repo>/ sets DOCS_BASE to /<repo>/ and
  # DOCS_HOSTNAME to that address.
  DOCS_BASE: /
  DOCS_HOSTNAME: https://mavlink-m.dronecode.org
  # The version a caller asks for, built below the root (config.mjs and
  # check_site.py reject anything but main or a release tag); empty, at the root.
  DOCS_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated timestamps come from git history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A release's pages restore no cache: a tag run can read caches that
          # other runs on main wrote, and cache contents are not verified.
          cache: ${{ !inputs.version && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.version }}
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        # The Python packages install from a hash lock, as wheels only. npm ci
        # installs exactly what the lockfile pins, without running any
        # package's install script (esbuild's binary arrives as its own
        # platform package). npm audit signatures then checks every package
        # against the registry's signing keys.
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --no-deps -r ../.github/requirements/docs.txt
          npm ci --ignore-scripts
          npm audit signatures

      - name: Test the site checks
        run: |
          python3 -m unittest discover --start-directory scripts/tests --verbose
          python3 -m unittest discover --start-directory ../.github/scripts/docs/tests --verbose

      # Generated at the MAVLINK_REF pinned in .github/mavlink-pins.env.
      - name: Generate message reference
        run: npm run docs:messages

      - name: Build
        run: npm run docs:build

      # Every sitemap URL under the site address, and no dead link or anchor
      # on a hand-written page; dead anchors in the generated reference warn.
      - name: Check the built site
        run: npm run docs:check

      - name: Test the version layout and the version menu and banner rules
        run: npm run docs:test

      - name: Check the coverage of the site's version scripts
        # 100% of lines and branches; the tool is hash-locked and wheel-only.
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r ../.github/requirements/test.txt
          python3 -m coverage run --branch --data-file="$RUNNER_TEMP/.coverage" --source=scripts --omit='*/tests/*' \
            -m unittest scripts/tests/test_check_site.py scripts/tests/test_write_site_files.py
          python3 -m coverage report --data-file="$RUNNER_TEMP/.coverage" --show-missing --fail-under=100 \
            --include=scripts/check_site.py,scripts/write_site_files.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.version }}
        with:
          path: docs/.vitepress/dist

      - name: Upload the release's built pages
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checks out the site check script
      pages: write # deploy-pages publishes the built site to GitHub Pages
      id-token: write # and proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out the site check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/docs

      - name: Check the deployed site
        # The site is live once deploy-pages returns, but the CDN can lag,
        # so each request retries.
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: .github/scripts/docs/check_deployed_site.sh "$SITE"
