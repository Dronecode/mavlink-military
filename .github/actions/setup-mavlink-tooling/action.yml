name: Set up MAVLink generation tooling
description: >-
  Check out mavlink/mavlink (upstream message definitions) and pymavlink
  (the generator) at the commits that .github/mavlink-pins.env pins as
  MAVLINK_REF and PYMAVLINK_REF, install the generator's dependencies,
  and place this repository's dialect files beside the upstream
  definitions so includes resolve. Reading the pins from that one file
  keeps everything generated from this repository on the same commits.

inputs:
  python-version:
    description: Python version used for the generator, one whose wheels .github/requirements/generator.txt holds
    required: false
    default: "3.12.15"

runs:
  using: composite
  steps:
    - name: Read the generator pins
      id: pins
      shell: bash
      run: .github/scripts/generate_c_lib/read_pins.sh .github/mavlink-pins.env >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check out mavlink/mavlink (upstream message definitions)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mavlink/mavlink
        ref: ${{ steps.pins.outputs.mavlink }}
        path: mavlink
        # scripts/ holds check_api_break.py, which the wire-compat job runs.
        sparse-checkout: |
          message_definitions/v1.0
          scripts
        persist-credentials: false

    - name: Check out pymavlink (generator)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ArduPilot/pymavlink
        ref: ${{ steps.pins.outputs.pymavlink }}
        path: pymavlink
        persist-credentials: false

    - name: Install generator dependencies
      # Exact versions, each with the hash of every wheel, installed as
      # wheels only and without dependency resolution: no sdist build code
      # runs, and a file that differs from the lock fails the install.
      shell: bash
      run: |
        python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps \
          -r .github/requirements/generator.txt

    - name: Place the dialect beside the upstream definitions
      shell: bash
      run: cp military.xml military_extensions.xml mavlink/message_definitions/v1.0/
