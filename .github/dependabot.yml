# Keeps the SHA-pinned actions, the hash-locked Python packages and the
# docs site's npm packages current, each with one grouped pull request a
# month, a week after a release at the earliest; the SLSA generator that
# signs release provenance moves in a pull request of its own. The
# mavlink and pymavlink pins are MAVLINK_REF and PYMAVLINK_REF in
# .github/mavlink-pins.env; dependabot can't see them, so
# they move by hand, together, in a pull request whose checks pass.
version: 2
updates:
  # One entry for the workflows and the composite action, so their pins
  # move together. Composite actions are scanned per-directory, not via
  # the workflows, hence the second directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-mavlink-tooling"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Subjects and pull request titles in the type(scope) form that
    # check_commits.sh enforces. A bump spans several workflows, so it
    # takes the repo scope, not one workflow's ci scope. The short group
    # name keeps a grouped subject, "chore(repo): bump the ci group across
    # 2 directories with 5 updates", within 72 characters even with the
    # " (#NN)" a squash merge appends.
    commit-message:
      prefix: "chore(repo)"
    groups:
      ci:
        patterns:
          - "*"
        exclude-patterns:
          - "slsa-framework/*"
      # The SLSA generator that signs release provenance is called by
      # its tag, with its reviewed commit and the actions it downloads
      # listed in release.yml's env. A bump comes in a pull request of
      # its own, whose release checks fail until that env moves with
      # the tag, after a review of the new version's workflow, actions
      # and changelog.
      slsa:
        patterns:
          - "slsa-framework/*"

  # The hash-locked requirement files in .github/requirements, which the
  # workflows install with --require-hashes: dependabot moves each pin
  # together with the hashes of its new version. directories, like
  # above, keeps the path out of the titles, and the group name is short
  # enough that "chore(repo): bump the pip group across 1 directory with
  # 3 updates" stays within 72 characters with a squash merge's " (#NNN)".
  - package-ecosystem: "pip"
    directories:
      - "/.github/requirements"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(repo)"
    groups:
      pip:
        patterns:
          - "*"

  # The docs site's npm lockfile, through its two direct dependencies,
  # mermaid and VitePress. A package deeper in the lockfile that needs a
  # security fix arrives as a dependabot security update, outside this
  # schedule.
  - package-ecosystem: "npm"
    directories:
      - "/docs"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(repo)"
    groups:
      npm:
        patterns:
          - "*"
